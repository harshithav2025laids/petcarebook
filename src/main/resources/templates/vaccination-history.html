<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vaccination History - PetCareBook</title>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f0f2f8;
        }

        .header {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: white;
            padding: 22px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 12px rgba(79, 70, 229, 0.3);
        }

        .header-left { display: flex; align-items: center; gap: 12px; }
        .header h1 { font-size: 22px; font-weight: 700; }
        .header p { font-size: 13px; opacity: 0.85; margin-top: 2px; }

        .header-right a {
            color: white;
            text-decoration: none;
            font-size: 14px;
            opacity: 0.85;
            padding: 8px 16px;
            border: 1px solid rgba(255,255,255,0.4);
            border-radius: 6px;
        }

        .header-right a:hover { background: rgba(255,255,255,0.15); opacity: 1; }

        .container {
            width: 92%;
            max-width: 1000px;
            margin: 36px auto;
        }

        .page-title {
            font-size: 22px;
            font-weight: 700;
            color: #1e1b4b;
            margin-bottom: 20px;
        }

        /* Pet selector form */
        .filter-card {
            background: white;
            padding: 24px 28px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.07);
            margin-bottom: 28px;
            display: flex;
            align-items: flex-end;
            gap: 16px;
        }

        .filter-card .field {
            flex: 1;
        }

        .filter-card label {
            display: block;
            font-weight: 600;
            font-size: 13px;
            color: #374151;
            margin-bottom: 6px;
        }

        .filter-card select {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
            background: white;
        }

        .filter-card select:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79,70,229,0.1);
        }

        .filter-card button {
            padding: 10px 24px;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            white-space: nowrap;
        }

        .filter-card button:hover { opacity: 0.9; }

        .empty-state {
            background: white;
            border-radius: 12px;
            padding: 60px;
            text-align: center;
            box-shadow: 0 2px 12px rgba(0,0,0,0.07);
        }

        .empty-state .icon { font-size: 52px; margin-bottom: 16px; }
        .empty-state h3 { font-size: 18px; color: #1e1b4b; margin-bottom: 8px; }
        .empty-state p { color: #6b7280; font-size: 14px; }

        .pet-info {
            background: white;
            padding: 18px 22px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            margin-bottom: 20px;
            border-left: 4px solid #10b981;
            font-size: 15px;
            color: #1e1b4b;
            font-weight: 600;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(0,0,0,0.07);
        }

        thead {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
        }

        thead th {
            padding: 14px 18px;
            text-align: left;
            font-size: 13px;
            font-weight: 600;
        }

        tbody tr {
            border-bottom: 1px solid #f3f4f6;
            transition: background 0.15s;
        }

        tbody tr:last-child { border-bottom: none; }
        tbody tr:hover { background: #f9fafb; }

        tbody td {
            padding: 14px 18px;
            font-size: 14px;
            color: #374151;
        }

        .back-link {
            display: inline-block;
            margin-top: 24px;
            color: #4f46e5;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }

        .back-link:hover { text-decoration: underline; }
    </style>
</head>

<body>

<div class="header">
    <div class="header-left">
        <span style="font-size:26px;">🐾</span>
        <div>
            <h1>PetCareBook</h1>
            <p>Vaccination History</p>
        </div>
    </div>
    <div class="header-right">
        <a href="/">← Dashboard</a>
    </div>
</div>

<div class="container">

    <h2 class="page-title">📋 Vaccination History</h2>

    <!-- Pet selector -->
    <div class="filter-card">
        <div class="field">
            <label for="petSelect">Select a Pet</label>
            <select id="petSelect" onchange="window.location='/vaccinations/history?petId=' + this.value">
                <option value="">-- Choose a pet --</option>
                <option th:each="pet : ${pets}"
                        th:value="${pet.id}"
                        th:text="${pet.name} + ' (' + ${pet.species} + ')'"
                        th:selected="${selectedPetId != null and selectedPetId == pet.id}">
                </option>
            </select>
        </div>
    </div>

    <!-- No pet selected -->
    <div th:if="${selectedPetId == null}" class="empty-state">
        <div class="icon">🐾</div>
        <h3>Select a Pet</h3>
        <p>Choose a pet from the dropdown above to view their vaccination history.</p>
    </div>

    <!-- Pet selected but no records -->
    <div th:if="${selectedPetId != null and records.empty}" class="empty-state">
        <div class="icon">💉</div>
        <h3>No Records Found</h3>
        <p>No vaccination records found for this pet yet.</p>
    </div>

    <!-- Records table -->
    <div th:if="${selectedPetId != null and !records.empty}">
        <div class="pet-info" th:text="'Showing history for: ' + ${records[0].pet.name}"></div>

        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Vaccine</th>
                    <th>Date Given</th>
                    <th>Next Due Date</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="record, stat : ${records}">
                    <td th:text="${stat.count}">1</td>
                    <td th:text="${record.vaccinationType.vaccineName}">-</td>
                    <td th:text="${record.dateGiven}">-</td>
                    <td th:text="${record.nextDueDate}">-</td>
                </tr>
            </tbody>
        </table>
    </div>

    <a href="/" class="back-link">← Back to Dashboard</a>

</div>

</body>
</html>
