<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register Pet - PetCareBook</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f0f2f8;
        }

        .header {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: white;
            padding: 22px 40px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 2px 12px rgba(79, 70, 229, 0.3);
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
        }

        .header p {
            font-size: 13px;
            opacity: 0.85;
            margin-top: 2px;
        }

        .container {
            width: 100%;
            max-width: 520px;
            margin: 40px auto;
            background: white;
            padding: 36px 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        .container h2 {
            font-size: 20px;
            font-weight: 700;
            color: #1e1b4b;
            margin-bottom: 28px;
            padding-bottom: 14px;
            border-bottom: 2px solid #f3f4f6;
        }

        label {
            display: block;
            margin-top: 18px;
            font-weight: 600;
            font-size: 14px;
            color: #374151;
            margin-bottom: 6px;
        }

        input, select {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            color: #111827;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            background: white;
        }

        input:focus, select:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .form-actions {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-top: 30px;
        }

        button {
            padding: 11px 28px;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }

        button:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        a.back-link {
            color: #4f46e5;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }

        a.back-link:hover {
            text-decoration: underline;
        }

    </style>

</head>

<body>

<div class="header">

    <span style="font-size:26px;">🐾</span>

    <div>
        <h1>PetCareBook</h1>

        <p>Register New Pet</p>
    </div>

</div>


<div class="container">

    <h2>Pet Registration</h2>

    <form action="/pets/save" method="post">

        <label for="petName">Pet Name</label>

        <input type="text"
               id="petName"
               name="name"
               placeholder="Enter pet name"
               required>


        <label for="species">Species</label>

        <select id="species" name="species" required>

            <option value="">Select Species</option>

            <option value="Dog">Dog</option>

            <option value="Cat">Cat</option>

            <option value="Rabbit">Rabbit</option>

            <option value="Bird">Bird</option>

            <option value="Other">Other</option>

        </select>


        <label for="breed">Breed</label>

        <input type="text"
               id="breed"
               name="breed"
               placeholder="Enter breed">


        <label for="dateOfBirth">Date of Birth</label>

        <input type="date"
               id="dateOfBirth"
               name="dateOfBirth"
               required>


        <label for="ownerId">Owner</label>

        <select id="ownerId" name="ownerId" required>

            <option value="">Select Owner</option>

            <option th:each="owner : ${owners}"
                    th:value="${owner.id}"
                    th:text="${owner.name}">
            </option>

        </select>


        <div class="form-actions">
            <button type="submit">
                Save Pet
            </button>

            <a href="/" class="back-link">
                ← Back to Dashboard
            </a>
        </div>

    </form>

</div>

</body>
</html>
