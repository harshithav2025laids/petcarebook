<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - PetCareBook</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-card {
      background: white;
      border-radius: 16px;
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
    }

    .logo {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo .paw {
      font-size: 48px;
      display: block;
      margin-bottom: 10px;
    }

    .logo h1 {
      font-size: 26px;
      font-weight: 700;
      color: #1e1b4b;
    }

    .logo p {
      color: #6b7280;
      font-size: 14px;
      margin-top: 4px;
    }

    .error-msg {
      background: #fef2f2;
      border: 1px solid #fca5a5;
      color: #b91c1c;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 20px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: 600;
      font-size: 14px;
      color: #374151;
      margin-bottom: 6px;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
      color: #111827;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
    }

    .btn-login {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.2s, transform 0.1s;
    }

    .btn-login:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }

    .btn-login:active {
      transform: translateY(0);
    }

    .hint {
      text-align: center;
      margin-top: 20px;
      color: #9ca3af;
      font-size: 13px;
    }

    .hint span {
      color: #4f46e5;
      font-weight: 600;
    }
  </style>
</head>
<body>

<div class="login-card">
  <div class="logo">
    <span class="paw">🐾</span>
    <h1>PetCareBook</h1>
    <p>Pet Vaccination Reminder System</p>
  </div>

  <div th:if="${error}" class="error-msg">
    Invalid username or password. Please try again.
  </div>

  <form action="/login" method="post">
    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" placeholder="Enter username" required>
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Enter password" required>
    </div>

    <button type="submit" class="btn-login">Sign In</button>
  </form>

  <p class="hint">Default credentials: <span>admin</span> / <span>admin123</span></p>
</div>

</body>
</html>
